# ── ARTEK backend – production stack ─────────────────────────────
# Usage (from this directory):
#   DB_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
# DB_PASSWORD is read from the shell environment or from the .env file
# next to this file (Compose also loads .env for ${...} substitution).
name: artek

services:
  artek-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: artek_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: artek
    volumes:
      - artek_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artek_user -d artek"]
      interval: 10s
      timeout: 5s
      retries: 5

  artek-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    env_file: .env
    environment:
      PORT: 5000
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      DATABASE_URL: postgresql://artek_user:${DB_PASSWORD}@artek-postgres:5432/artek
    volumes:
      - ${UPLOADS_HOST_DIR:-/var/www/artek/uploads}:/app/uploads
    depends_on:
      artek-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  artek_pgdata:
